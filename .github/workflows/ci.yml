
name: HTML CSS JS Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check HTML
        run: npx --yes htmlhint index.html

      - name: Check JavaScript Syntax
        run: node --check frist.js

      - name: Check formatting
        run: npx --yes prettier --check index.html style.css frist.js
